name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: |
          npm run build
          echo "Build ID: ${{ github.run_id }} - FTPS - $(date)" > dist/deploy_debug.txt
          echo "Listing build directory contents:"
          ls -R dist/

      - name: Sync files (SFTP via Python/paramiko)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          pip install paramiko --quiet
          python3 << 'PYEOF'
          import paramiko, os, sys

          def upload_dir(sftp, local_path, remote_path):
              try:
                  sftp.mkdir(remote_path)
              except Exception:
                  pass
              for item in sorted(os.listdir(local_path)):
                  local_item = os.path.join(local_path, item)
                  remote_item = remote_path + "/" + item
                  if os.path.isfile(local_item):
                      print("  uploading:", remote_item)
                      sftp.put(local_item, remote_item)
                  elif os.path.isdir(local_item):
                      upload_dir(sftp, local_item, remote_item)

          hostname = os.environ["FTP_SERVER"]
          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]

          ssh = paramiko.SSHClient()
          ssh.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          ssh.connect(hostname, port=65002, username=username, password=password, timeout=60)
          sftp = ssh.open_sftp()

          upload_dir(sftp, "./dist", "public_html")

          sftp.close()
          ssh.close()
          print("Deploy completo!")
          PYEOF

      - name: Purge LiteSpeed cache
        run: |
          echo "Purging server cache..."
          curl -sf -o /dev/null "https://lepoa.online/?purge=all" || true
          curl -sf -o /dev/null "https://lepoa.online/index.html?nocache=${{ github.run_id }}" || true
          echo "Cache purge request sent (run_id: ${{ github.run_id }})"
