name: Deploy to Hostinger

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: |
          npm run build
          echo "Build ID: ${{ github.run_id }} - FTPS - $(date)" > dist/deploy_debug.txt
          echo "Listing build directory contents:"
          ls -R dist/

      - name: Sync files (SFTP via lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          cat > /tmp/lftp_deploy.conf << LFTP_EOF
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          set net:timeout 60
          set net:max-retries 3
          open -u $FTP_USERNAME,$FTP_PASSWORD sftp://$FTP_SERVER:65002
          mirror -R --no-perms --parallel=4 ./dist/ public_html/
          quit
          LFTP_EOF
          lftp -f /tmp/lftp_deploy.conf

      - name: Purge LiteSpeed cache
        run: |
          echo "Purging server cache..."
          curl -sf -o /dev/null "https://lepoa.online/?purge=all" || true
          curl -sf -o /dev/null "https://lepoa.online/index.html?nocache=${{ github.run_id }}" || true
          echo "Cache purge request sent (run_id: ${{ github.run_id }})"
